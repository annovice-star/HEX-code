<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" lang="ko" role="img"><title>선전 회의 일정 읽기</title><desc>편집 정리 · 2026년 10월 20일까지 공개된 정보; 11월 17~18일: APEC CEO 서밋: 기업계 관련 논의; 11월 18~19일: APEC 정상회의: 지역 협력의 주요 일정; 세 가지 우선 분야: 개방 · 혁신 · 협력: 연중 의제 읽기의 기준. 참고자료 [1]~[3] 기반 · 공식 일정표가 아닙니다</desc><rect width="1200" height="780" fill="#f2f3ec"/><g font-family="Arial, Noto Sans, sans-serif"><text x="64" y="78" font-size="36" fill="#153d3a" font-weight="700"><tspan x="64" dy="0">선전 회의 일정 읽기</tspan></text><text x="64" y="145" font-size="20" fill="#55706c" font-weight="400"><tspan x="64" dy="0">편집 정리 · 2026년 10월 20일까지 공개된 정보</tspan></text><rect x="64" y="210" width="340" height="410" rx="22" fill="white" stroke="#d4dfd8"/><rect x="64" y="210" width="340" height="8" rx="4" fill="#1c7169"/><text x="88" y="263" font-size="18" fill="#6e8c83">01</text><text x="88" y="315" font-size="27" fill="#153d3a" font-weight="700"><tspan x="88" dy="0">11월 17~18일</tspan></text><text x="88" y="378.45" font-size="25" fill="#17665e" font-weight="400"><tspan x="88" dy="0">APEC CEO 서밋</tspan></text><text x="88" y="439.2" font-size="21" fill="#55706c" font-weight="400"><tspan x="88" dy="0">기업계 관련 논의</tspan></text><rect x="426" y="210" width="340" height="410" rx="22" fill="white" stroke="#d4dfd8"/><rect x="426" y="210" width="340" height="8" rx="4" fill="#1c7169"/><text x="450" y="263" font-size="18" fill="#6e8c83">02</text><text x="450" y="315" font-size="27" fill="#153d3a" font-weight="700"><tspan x="450" dy="0">11월 18~19일</tspan></text><text x="450" y="378.45" font-size="25" fill="#17665e" font-weight="400"><tspan x="450" dy="0">APEC 정상회의</tspan></text><text x="450" y="439.2" font-size="21" fill="#55706c" font-weight="400"><tspan x="450" dy="0">지역 협력의 주요 일정</tspan></text><rect x="788" y="210" width="340" height="410" rx="22" fill="white" stroke="#d4dfd8"/><rect x="788" y="210" width="340" height="8" rx="4" fill="#70b84c"/><text x="812" y="263" font-size="18" fill="#