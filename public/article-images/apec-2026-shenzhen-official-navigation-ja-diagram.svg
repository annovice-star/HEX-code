<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" lang="ja" role="img"><title>問いに合わせて公式窓口へ</title><desc>深圳の公式情報案内 · 読む順序の提案; 背景を知る: 市商務局・投資深圳: 都市と投資の資料; 方向性を確かめる: 市の担当部門・政策原文: 具体的な文書と担当機関; 手続きを調べる: 市市場監督管理局・前海管理局: 手続きガイドと申請通知. 深圳の公式窓口に基づく · 統一手続きではありません</desc><rect width="1200" height="780" fill="#f2f3ec"/><g font-family="Arial, Noto Sans, sans-serif"><text x="64" y="78" font-size="36" fill="#153d3a" font-weight="700"><tspan x="64" dy="0">問いに合わせて公式窓口へ</tspan></text><text x="64" y="145" font-size="20" fill="#55706c" font-weight="400"><tspan x="64" dy="0">深圳の公式情報案内· 読む順序の提案</tspan></text><rect x="64" y="210" width="340" height="410" rx="22" fill="white" stroke="#d4dfd8"/><rect x="64" y="210" width="340" height="8" rx="4" fill="#1c7169"/><text x="88" y="263" font-size="18" fill="#6e8c83">01</text><text x="88" y="315" font-size="27" fill="#153d3a" font-weight="700"><tspan x="88" dy="0">背景を知る</tspan></text><text x="88" y="378.45" font-size="25" fill="#17665e" font-weight="400"><tspan x="88" dy="0">市商務局・投資深圳</tspan></text><text x="88" y="439.2" font-size="21" fill="#55706c" font-weight="400"><tspan x="88" dy="0">都市と投資の資料</tspan></text><rect x="426" y="210" width="340" height="410" rx="22" fill="white" stroke="#d4dfd8"/><rect x="426" y="210" width="340" height="8" rx="4" fill="#1c7169"/><text x="450" y="263" font-size="18" fill="#6e8c83">02</text><text x="450" y="315" font-size="27" fill="#153d3a" font-weight="700"><tspan x="450" dy="0">方向性を確かめる</tspan></text><text x="450" y="378.45" font-size="25" fill="#17665e" font-weight="400"><tspan x="450" dy="0">市の担当部門・政策原文</tspan></text><text x="450" y="439.2" font-size="21" fill="#55706c" font-weight="400"><tspan x="450" dy="0">具体的な文書と担当機関</tspan></text><rect x="788" y="210" width="340" height="410" rx="22" fill="white" stroke="#d4dfd8"/><rect x="788" y="210" width="340" height="8" rx="4" fill="#70b84c"/><text x="812" y="263" font-size="18" fill="#6e8c83">03</text><text x="812" y="315" font-s