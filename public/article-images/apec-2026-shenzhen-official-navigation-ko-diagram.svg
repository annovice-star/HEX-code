<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" lang="ko" role="img"><title>질문에 맞는 공식 창구 찾기</title><desc>선전 공식 정보 안내 · 권장 읽기 순서; 배경 이해: 시 상무국 · 선전 투자: 도시와 투자 자료; 방향 확인: 시 담당 부서 · 정책 원문: 구체적인 문서와 책임 기관; 업무 절차 확인: 시 시장감독관리국 · 첸하이관리국: 업무 가이드와 신청 통지. 선전 공식 창구 기반 · 통합 업무 절차가 아닙니다</desc><rect width="1200" height="780" fill="#f2f3ec"/><g font-family="Arial, Noto Sans, sans-serif"><text x="64" y="78" font-size="36" fill="#153d3a" font-weight="700"><tspan x="64" dy="0">질문에 맞는 공식 창구 찾기</tspan></text><text x="64" y="145" font-size="20" fill="#55706c" font-weight="400"><tspan x="64" dy="0">선전 공식 정보 안내 · 권장 읽기 순서</tspan></text><rect x="64" y="210" width="340" height="410" rx="22" fill="white" stroke="#d4dfd8"/><rect x="64" y="210" width="340" height="8" rx="4" fill="#1c7169"/><text x="88" y="263" font-size="18" fill="#6e8c83">01</text><text x="88" y="315" font-size="27" fill="#153d3a" font-weight="700"><tspan x="88" dy="0">배경 이해</tspan></text><text x="88" y="378.45" font-size="25" fill="#17665e" font-weight="400"><tspan x="88" dy="0">시 상무국 · 선전 투자</tspan></text><text x="88" y="439.2" font-size="21" fill="#55706c" font-weight="400"><tspan x="88" dy="0">도시와 투자 자료</tspan></text><rect x="426" y="210" width="340" height="410" rx="22" fill="white" stroke="#d4dfd8"/><rect x="426" y="210" width="340" height="8" rx="4" fill="#1c7169"/><text x="450" y="263" font-size="18" fill="#6e8c83">02</text><text x="450" y="315" font-size="27" fill="#153d3a" font-weight="700"><tspan x="450" dy="0">방향 확인</tspan></text><text x="450" y="378.45" font-size="25" fill="#17665e" font-weight="400"><tspan x="450" dy="0">시 담당 부서 · 정책 원문</tspan></text><text x="450" y="439.2" font-size="21" fill="#55706c" font-weight="400"><tspan x="450" dy="0">구체적인 문서와 책임 기관</tspan></text><rect x="788" y="210" width="340" height="410" rx="22" fill="white" stroke="#d4dfd8"/><rect x="788" y="210" width="340" height="8" rx="4" fill="#70b84c"/><text x="812" y="263" font-size="18" fill="#6e8c83">03</text><text x="812" y="315" font-size="27" fill="#153d3a" font-weight="700"><tspan x="812" dy="0">업무 절차 확인</tspan></text><text x="812" y="378.45" font-size="25" fill="#17665e" font-weight="400"><tspan x="812" dy="0">시 시장감독관리국 ·</tspan><tspan x="812" dy="33.75">첸하이관리국</tspan></text><text x="812" y="472.95" font-size="21" fill="#55706c" font-weight="400"><tspan x="812" dy="0">업무 가이드와 신청 통지</tspan></text><text x="64" y="694" font-size="20" fill="#55706c" font-weight="400"><tspan x="64" dy="0">선전 공식 창구 기반 · 통합 업무 절차가 아닙니다</tspan></text><text x="64" y="752" font-size="17" fill="#55706c">HEX CUBES · APEC 2026</text></g></svg>
